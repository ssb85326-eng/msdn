<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>数据管理 · WinNew</title><link rel="stylesheet" href="assets/css/style.css"></head><body><header class="site-header"><div class="container header-inner"><a class="brand" href="index.html"><span class="brand-mark">W</span><span>WinNew</span></a><nav class="site-nav"><a href="index.html">返回首页</a><a class="active" href="admin.html">数据管理</a></nav></div></header><main class="container admin-page"><div class="section-heading"><div><span class="eyebrow">MEDIA DATA MANAGER</span><h1>镜像数据管理</h1></div><div class="admin-actions"><button id="import-button" class="copy-button" type="button">导入 JSON</button><button id="export-button" class="download-button" type="button">导出 JSON</button><input id="file-input" type="file" accept=".json,application/json" hidden></div></div><p class="admin-lead">数据保存在当前浏览器本地。录入真实来源、校验值和下载地址后，首页会立即使用这些数据。</p><div class="admin-layout"><form id="image-form" class="data-form"><input id="edit-id" type="hidden"><label>系统<input id="system" required placeholder="Windows 11"></label><label>版本号<input id="version" required placeholder="24H2"></label><label>发布日期<input id="releaseDate" required type="date"></label><label>版本<select id="edition" required><option>消费者版</option><option>商业版</option><option>教育版</option><option>专业版</option></select></label><label>语言<input id="language" required placeholder="简体中文"></label><label>架构<select id="arch" required><option>x64</option><option>x86</option><option>ARM64</option></select></label><label>文件大小<input id="size" required placeholder="5.89 GB"></label><label>校验类型<select id="hashType" required><option>SHA256</option><option>SHA1</option><option>MD5</option></select></label><label class="wide">校验值<input id="hash" required placeholder="输入完整校验值"></label><label class="wide">下载地址<input id="downloadUrl" required type="url" placeholder="https://..."></label><label class="wide">来源<input id="source" required placeholder="Microsoft 官方"></label><div class="form-actions wide"><button class="download-button" type="submit">保存数据</button><button id="clear-form" class="copy-button" type="button">清空表单</button></div></form><section><div class="data-list-heading"><h2>已录入数据</h2><span id="admin-count"></span></div><div id="admin-list" class="admin-list"></div></section></div></main><div id="admin-toast" class="toast" role="status"></div><script type="module" src="assets/js/admin.js"></script></body></html>
