<style>
/* ============ Token ============ */
:root{
  --bg:#EEF3F9;
  --bg-2:#E3ECF6;
  --surface:#FFFFFF;
  --surface-2:#F6FAFE;
  --border:#DDE6F0;
  --border-strong:#C5D4E4;
  --ink:#14202E;
  --ink-2:#45596D;
  --ink-3:#7E92A6;
  --accent:#0B6FCC;
  --accent-deep:#0A4F99;
  --accent-soft:#E2F0FD;
  --cyan:#00A9C7;
  --green:#0F7B28;
  --green-soft:#E4F5E7;
  --violet:#6E4FA5;
  --violet-soft:#EFE9F9;
  --amber:#9A6A00;
  --amber-soft:#FBF0D9;
  --gray-soft:#EDF1F6;
  --hero-1:#04223D;
  --hero-2:#0B4F9E;
  --hero-3:#0E7BD4;
  --shadow:0 1px 2px rgba(9,30,56,.05),0 4px 16px rgba(9,30,56,.05);
  --shadow-lg:0 2px 6px rgba(9,30,56,.06),0 14px 40px rgba(9,30,56,.10);
  --radius:14px;
  --radius-sm:9px;
  --mono:"Cascadia Code","SF Mono",Consolas,Menlo,"Liberation Mono",monospace;
  --font:"Segoe UI Variable Text","Segoe UI","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
html[data-theme="dark"]{
  --bg:#0B141E;
  --bg-2:#0E1A27;
  --surface:#12202F;
  --surface-2:#162636;
  --border:#22344A;
  --border-strong:#31496A;
  --ink:#E8F0F8;
  --ink-2:#A9BED2;
  --ink-3:#74879B;
  --accent:#4CB1FF;
  --accent-deep:#7CC4FF;
  --accent-soft:#12304E;
  --cyan:#3FC7E0;
  --green:#4CC24A;
  --green-soft:#12301F;
  --violet:#B48FE8;
  --violet-soft:#2B2143;
  --amber:#E3B341;
  --amber-soft:#3A2E12;
  --gray-soft:#1A2A3A;
  --hero-1:#05182B;
  --hero-2:#0A3E7C;
  --hero-3:#0E6FBF;
  --shadow:0 1px 2px rgba(0,0,0,.28),0 6px 20px rgba(0,0,0,.22);
  --shadow-lg:0 2px 6px rgba(0,0,0,.3),0 16px 44px rgba(0,0,0,.34);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--ink);
  font-size:14.5px;
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--accent);text-decoration:none}
a:hover{color:var(--accent-deep)}
button{font-family:inherit;cursor:pointer;color:inherit}
::selection{background:rgba(11,111,204,.22)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:5px}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}
  html{scroll-behavior:auto}
}

/* ============ 顶栏 ============ */
.topbar{
  position:sticky;top:0;z-index:60;
  background:color-mix(in srgb,var(--surface) 84%,transparent);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
}
.topbar-inner{
  max-width:1200px;margin:0 auto;padding:0 22px;height:62px;
  display:flex;align-items:center;gap:18px;
}
.brand{display:flex;align-items:center;gap:11px;flex-shrink:0;color:var(--ink)}
.brand-mark{
  width:34px;height:34px;border-radius:9px;flex-shrink:0;
  display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:2.5px;padding:5px;
  background:linear-gradient(135deg,var(--accent) 0%,var(--cyan) 100%);
  box-shadow:0 2px 8px rgba(11,111,204,.28);
  transition:transform .2s;
}
.brand:hover .brand-mark{transform:rotate(-6deg) scale(1.04)}
.brand-mark i{background:#fff;border-radius:2px}
.brand-name{font-size:18px;font-weight:800;letter-spacing:.3px}
.brand-name em{font-style:normal;color:var(--accent)}
.brand-tag{font-size:11.5px;color:var(--ink-3);margin-left:2px;border-left:1px solid var(--border);padding-left:12px;white-space:nowrap}
.nav{display:flex;align-items:center;gap:4px;margin-left:8px}
.nav a{
  padding:7px 13px;border-radius:9px;font-size:13.5px;font-weight:500;color:var(--ink-2);
  transition:background .15s,color .15s;
}
.nav a:hover{background:var(--gray-soft);color:var(--ink)}
.nav a.active{background:var(--accent-soft);color:var(--accent-deep);font-weight:600}
.top-search{flex:1;display:flex;justify-content:center;min-width:0}
.search-box{
  width:100%;max-width:400px;display:flex;align-items:center;gap:9px;
  background:var(--surface-2);border:1px solid var(--border);border-radius:11px;
  padding:8px 13px;transition:border-color .15s,box-shadow .15s,background .15s;
}
.search-box:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 14%,transparent);background:var(--surface)}
.search-box svg{flex-shrink:0;color:var(--ink-3)}
.search-box input{border:none;outline:none;background:transparent;width:100%;font-size:14px;font-family:inherit;color:var(--ink)}
.search-box input::placeholder{color:var(--ink-3)}
.top-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
.icon-btn{
  width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;
  border:1px solid var(--border);background:var(--surface);border-radius:11px;color:var(--ink-2);
  transition:all .15s;
}
.icon-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.menu-btn{display:none}

/* ============ 按钮 ============ */
.btn{
  display:inline-flex;align-items:center;gap:7px;
  border:1px solid var(--border);background:var(--surface);color:var(--ink);
  border-radius:11px;padding:8px 15px;font-size:13.5px;font-weight:500;
  transition:all .15s;white-space:nowrap;
}
.btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.btn svg{flex-shrink:0}
.btn-primary{background:linear-gradient(135deg,var(--accent) 0%,color-mix(in srgb,var(--accent) 72%,var(--cyan)) 100%);border-color:transparent;color:#fff;box-shadow:0 2px 10px rgba(11,111,204,.22)}
.btn-primary:hover{filter:brightness(1.07);color:#fff}
.btn-sm{padding:6px 12px;font-size:12.5px;border-radius:9px}
.btn-ghost{background:transparent}

/* ============ 视图容器 ============ */
#view{max-width:1200px;margin:0 auto;padding:26px 22px 10px;min-height:62vh}
.view{animation:viewIn .3s cubic-bezier(.22,1,.36,1)}
@keyframes viewIn{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.view{animation:none}}

/* ============ Hero ============ */
.hero{
  position:relative;overflow:hidden;
  background:linear-gradient(132deg,var(--hero-1) 0%,var(--hero-2) 48%,var(--hero-3) 100%);
  color:#fff;border-radius:var(--radius);
  padding:42px 44px;margin-bottom:20px;
  box-shadow:var(--shadow-lg);
}
.hero::before{
  content:"";position:absolute;inset:0;
  background-image:radial-gradient(rgba(255,255,255,.16) 1px,transparent 1.5px);
  background-size:22px 22px;
  mask-image:linear-gradient(115deg,transparent 0%,#000 55%);
  -webkit-mask-image:linear-gradient(115deg,transparent 0%,#000 55%);
  pointer-events:none;
}
.hero::after{
  content:"";position:absolute;right:-90px;top:-110px;width:360px;height:360px;border-radius:50%;
  background:radial-gradient(circle,rgba(76,177,255,.22),transparent 62%);
  pointer-events:none;
}
.hero-inner{position:relative;z-index:1}
.hero .kicker{
  display:inline-flex;align-items:center;gap:7px;
  font-size:12.5px;font-weight:600;letter-spacing:.04em;color:#BFE3FF;
  background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.22);
  padding:5px 11px;border-radius:999px;margin-bottom:16px;
}
.hero h1{font-size:clamp(26px,3.4vw,38px);font-weight:800;letter-spacing:-.01em;line-height:1.22;text-wrap:balance}
.hero .sub{font-size:14.5px;color:rgba(255,255,255,.84);margin-top:10px;max-width:640px;line-height:1.7}
.hero-actions{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.hero-actions .btn{background:#fff;border-color:transparent;color:var(--hero-2);font-weight:600;padding:10px 20px;min-height:44px}
.hero-actions .btn:hover{background:#E8F4FF}
.hero-actions .btn-ghost{background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.32);color:#fff}
.hero-actions .btn-ghost:hover{background:rgba(255,255,255,.18);color:#fff}
.hero-stats{
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:28px;
}
.hstat{
  background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.20);
  border-radius:12px;padding:13px 16px;backdrop-filter:blur(4px);
}
.hstat b{display:block;font-size:22px;font-weight:800;font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.hstat span{font-size:12.5px;opacity:.85}

/* ============ 面板 ============ */
.panel{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:22px 24px;margin-bottom:20px;
}
.panel-head{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.panel-title{font-size:17px;font-weight:700;display:flex;align-items:center;gap:9px}
.panel-title svg{color:var(--accent)}
.panel-sub{font-size:13px;color:var(--ink-2);margin-top:2px}
.panel-tools{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* ============ 家族卡片 ============ */
.family-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:14px}
.family-card{
  position:relative;display:block;color:var(--ink);
  border:1px solid var(--border);border-radius:var(--radius);
  padding:17px 18px;background:var(--surface-2);
  transition:transform .16s,box-shadow .16s,border-color .16s;
  overflow:hidden;
}
.family-card:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:var(--shadow-lg);color:var(--ink)}
.family-card .fc-top{display:flex;align-items:center;gap:11px;margin-bottom:12px}
.fc-ico{
  width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;
  color:#fff;flex-shrink:0;
}
.fc-ico.win11{background:linear-gradient(135deg,#006FC2,#00A9C7)}
.fc-ico.win10{background:linear-gradient(135deg,#0B6FCC,#4CB1FF)}
.fc-ico.server{background:linear-gradient(135deg,#3B5B8C,#6E8FC0)}
.fc-ico.win8{background:linear-gradient(135deg,#5A6E8C,#8FA6C2)}
.fc-ico.tools{background:linear-gradient(135deg,#6E4FA5,#A98ED8)}
.fc-ico.office{background:linear-gradient(135deg,#0F7B28,#55B74F)}
.family-card h3{font-size:15px;font-weight:700}
.family-card .fc-desc{font-size:12.5px;color:var(--ink-2);margin-top:1px}
.family-card .fc-meta{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;color:var(--ink-3);border-top:1px dashed var(--border);padding-top:11px;margin-top:4px}
.family-card .fc-meta b{font-family:var(--mono);font-weight:600;color:var(--accent);font-size:14px}
.family-card .fc-go{position:absolute;right:16px;top:16px;color:var(--ink-3);opacity:0;transform:translateX(-4px);transition:all .16s}
.family-card:hover .fc-go{opacity:1;transform:none;color:var(--accent)}

/* ============ 概览小部件 ============ */
.ov-row{display:flex;align-items:center;gap:12px;font-size:13px;padding:7px 0}
.ov-row .ov-name{width:150px;color:var(--ink-2);flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ov-bar-wrap{flex:1;background:var(--gray-soft);border-radius:6px;height:16px;overflow:hidden}
.ov-bar{height:100%;border-radius:6px;min-width:3px;background:linear-gradient(90deg,var(--cyan),var(--accent));transition:width .4s}
.ov-row b{font-family:var(--mono);font-size:12.5px;width:30px;text-align:right;font-variant-numeric:tabular-nums}
.ov-row .ov-file{flex:1;font-size:12.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.recent-row .ov-file{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2);font-size:12.8px}
.recent-list{display:flex;flex-direction:column;gap:2px}
.recent-row{display:flex;align-items:center;gap:12px;font-size:13px;padding:8px 6px;border-bottom:1px dashed var(--border);color:var(--ink);border-radius:8px;transition:background .15s}
.recent-row:last-child{border-bottom:none}
.recent-row:hover{background:var(--gray-soft);color:var(--ink)}
.recent-date{font-family:var(--mono);font-size:12px;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:2px 8px;flex-shrink:0}
.recent-cat{font-size:12px;color:var(--ink-3);flex-shrink:0;width:86px}

/* ============ 特性条 ============ */
.feature-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.feature{border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;background:var(--surface-2)}
.feature .f-ico{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;margin-bottom:12px}
.feature h3{font-size:14.5px;font-weight:700;margin-bottom:6px}
.feature p{font-size:12.8px;color:var(--ink-2);line-height:1.65}
.f-ico.shield{background:linear-gradient(135deg,#0F7B28,#55B74F)}
.f-ico.check{background:linear-gradient(135deg,#0B6FCC,#4CB1FF)}
.f-ico.link{background:linear-gradient(135deg,#006FC2,#00A9C7)}

/* ============ CTA 条 ============ */
.cta-band{
  position:relative;overflow:hidden;
  background:linear-gradient(120deg,var(--hero-2),var(--hero-3));
  color:#fff;border-radius:var(--radius);padding:30px 34px;margin-bottom:20px;
  display:flex;align-items:center;gap:22px;flex-wrap:wrap;box-shadow:var(--shadow-lg);
}
.cta-band::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.14) 1px,transparent 1.5px);background-size:20px 20px;mask-image:linear-gradient(90deg,transparent,#000);-webkit-mask-image:linear-gradient(90deg,transparent,#000);pointer-events:none}
.cta-band h2{font-size:19px;font-weight:700;position:relative;z-index:1}
.cta-band p{font-size:13px;opacity:.85;margin-top:4px;position:relative;z-index:1}
.cta-band .btn{margin-left:auto;background:#fff;border-color:transparent;color:var(--hero-2);font-weight:600;position:relative;z-index:1}
.cta-band .btn:hover{background:#E8F4FF}

/* ============ 下载页布局 ============ */
.dl-head{margin-bottom:16px}
.dl-head h1{font-size:23px;font-weight:800;letter-spacing:-.01em}
.dl-head p{font-size:13px;color:var(--ink-2);margin-top:3px}
.dl-layout{display:grid;grid-template-columns:238px 1fr;gap:20px;align-items:start}
.sidebar{
  position:sticky;top:80px;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:12px;box-shadow:var(--shadow);
}
.side-group-title{
  font-size:11px;font-weight:700;color:var(--ink-3);letter-spacing:.06em;
  padding:11px 11px 6px;
}
.side-item{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  width:100%;text-align:left;background:none;border:none;
  padding:8px 11px;border-radius:9px;font-size:13.5px;color:var(--ink);transition:background .12s,color .12s;
}
.side-item:hover{background:var(--gray-soft)}
.side-item.active{background:var(--accent-soft);color:var(--accent-deep);font-weight:600}
.side-item .count{
  font-size:11px;color:var(--ink-3);background:var(--gray-soft);
  border-radius:999px;padding:1px 9px;font-family:var(--mono);
}
.side-item.active .count{background:#fff;color:var(--accent)}
.dl-main{min-width:0}
.dl-toolbar{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:12px 16px;margin-bottom:12px;box-shadow:var(--shadow);
}
.filter-label{font-size:12px;color:var(--ink-3);margin-right:2px}
.chip{
  border:1px solid var(--border);background:var(--surface);color:var(--ink-2);
  border-radius:999px;padding:4px 13px;font-size:12.5px;transition:all .13s;
}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500}
.dl-tools{margin-left:auto;display:flex;align-items:center;gap:8px}
.result-meta{font-size:12.5px;color:var(--ink-3);margin-bottom:12px;padding:0 2px}

/* ============ 镜像卡片 ============ */
.iso-list{display:flex;flex-direction:column;gap:11px}
.iso-item{
  border:1px solid var(--border);border-radius:var(--radius);
  padding:15px 17px;background:var(--surface);box-shadow:var(--shadow);
  transition:border-color .15s,box-shadow .15s;
}
.iso-item:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--border));box-shadow:var(--shadow-lg)}
.iso-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tag{
  display:inline-flex;align-items:center;gap:5px;
  font-size:11.5px;font-weight:600;border-radius:6px;padding:2.5px 9px;line-height:1.5;
}
.tag-arch{background:var(--accent-soft);color:var(--accent-deep)}
.tag-ed{background:var(--green-soft);color:var(--green)}
.tag-act{background:var(--violet-soft);color:var(--violet)}
.tag-date{background:var(--amber-soft);color:var(--amber)}
.tag-note{background:var(--gray-soft);color:var(--ink-2)}
.tag-direct{background:var(--green-soft);color:var(--green);display:inline-flex;align-items:center;gap:4px}
.iso-top{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
.iso-file{
  font-family:var(--mono);font-size:12.8px;color:var(--ink);
  word-break:break-all;flex:1;min-width:230px;
  background:var(--surface-2);border:1px solid var(--border);border-radius:9px;
  padding:8px 12px;line-height:1.55;font-variant-numeric:tabular-nums;
  cursor:pointer;transition:border-color .15s,color .15s;
}
.iso-file:hover{border-color:var(--accent);color:var(--accent-deep)}
.iso-actions{display:flex;gap:8px;flex-shrink:0;align-items:center;flex-wrap:wrap}

/* ============ 语言版本 ============ */
.lang-panel{margin-top:12px;border-top:1px dashed var(--border-strong);padding-top:13px;animation:viewIn .22s cubic-bezier(.22,1,.36,1)}
.lang-panel-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:11px}
.lang-panel-title{font-size:13px;font-weight:600;color:var(--ink);font-family:var(--mono)}
.lang-search{
  display:flex;align-items:center;gap:8px;margin-left:auto;
  background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:6px 12px;width:230px;
}
.lang-search:focus-within{border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 14%,transparent)}
.lang-search svg{color:var(--ink-3);flex-shrink:0}
.lang-search input{border:none;outline:none;background:transparent;width:100%;font-size:13.5px;font-family:inherit;color:var(--ink)}
.lang-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.lang-cell{
  display:flex;align-items:center;gap:9px;min-width:0;
  border:1px solid var(--border);border-radius:10px;padding:8px 11px;background:var(--surface-2);
}
.lang-cell .lang-name{font-size:12.8px;font-weight:600;color:var(--ink);flex-shrink:0;width:106px}
.lang-cell .lang-code{font-family:var(--mono);font-size:11px;color:var(--ink-3);flex-shrink:0;width:52px}
.lang-cell .lang-file{
  flex:1;font-family:var(--mono);font-size:10.8px;color:var(--ink-2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;
}
.lang-cell .lang-actions{display:flex;gap:5px;flex-shrink:0}
.lang-cell .btn{font-size:11.5px;padding:3px 9px}
.lang-toggle.active{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.lang-count{font-size:12px;color:var(--ink-3);margin-top:10px;text-align:right}

/* ============ FAQ ============ */
.faq-item{border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:10px;overflow:hidden;background:var(--surface)}
.faq-q{
  width:100%;text-align:left;background:none;border:none;
  padding:15px 17px;font-size:14.5px;font-weight:600;color:var(--ink);
  display:flex;justify-content:space-between;align-items:center;gap:12px;
}
.faq-q .arrow{transition:transform .22s;color:var(--ink-3);flex-shrink:0;display:flex}
.faq-item.open .arrow{transform:rotate(180deg);color:var(--accent)}
.faq-a{max-height:0;overflow:hidden;transition:max-height .26s ease}
.faq-a-inner{padding:0 17px 15px;font-size:13.5px;color:var(--ink-2);border-top:1px dashed var(--border);padding-top:13px;line-height:1.75}
.faq-a-inner a{word-break:break-all}

/* ============ 关于页 ============ */
.about-wrap{max-width:860px}
.about-section{margin-bottom:20px}
.about-section h2{font-size:16px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:9px}
.about-section h2 svg{color:var(--accent)}
.about-section p{font-size:13.8px;color:var(--ink-2);line-height:1.8}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:6px}
.step{border:1px solid var(--border);border-radius:var(--radius);padding:17px 18px;background:var(--surface-2)}
.step .n{font-family:var(--mono);font-size:12px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--accent),var(--cyan));width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;margin-bottom:11px}
.step h3{font-size:13.8px;font-weight:700;margin-bottom:5px}
.step p{font-size:12.6px;color:var(--ink-2);line-height:1.65}
.notice-box{
  border:1px solid color-mix(in srgb,var(--amber) 40%,var(--border));
  background:var(--amber-soft);border-radius:var(--radius);padding:16px 18px;
  font-size:13px;color:var(--ink);line-height:1.75;
}
.notice-box b{color:var(--amber)}

/* ============ 详情页 ============ */
.crumb{font-size:12.5px;color:var(--ink-3);margin-bottom:14px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.crumb a{color:var(--ink-2)}
.crumb a:hover{color:var(--accent)}
.crumb .sep{opacity:.5}
.detail-head h1{font-size:22px;font-weight:800;letter-spacing:-.01em;margin:12px 0 4px;text-wrap:balance}
.detail-head .d-sub{font-size:13px;color:var(--ink-2);margin-bottom:14px}
.d-file{
  font-family:var(--mono);font-size:13.5px;background:var(--surface-2);
  border:1px solid var(--border);border-radius:11px;padding:12px 14px;
  word-break:break-all;line-height:1.6;font-variant-numeric:tabular-nums;
}
.d-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.d-actions .btn{padding:9px 18px;font-size:14px}
.d-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.d-meta-cell{border:1px solid var(--border);border-radius:10px;background:var(--surface-2);padding:11px 14px}
.d-meta-cell span{display:block;font-size:11.5px;color:var(--ink-3);margin-bottom:3px}
.d-meta-cell b{font-size:13.5px;font-weight:600;word-break:break-all}
.rel-item{display:flex;align-items:center;gap:12px;padding:10px 2px;border-bottom:1px dashed var(--border);font-size:13px;flex-wrap:wrap}
.rel-item:last-child{border-bottom:none}
.rel-item .ov-file{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--mono);font-size:12px;color:var(--ink-2)}
.rel-item .rel-actions{display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap}
.fam-chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
@media (max-width:720px){.d-meta{grid-template-columns:1fr 1fr}}
@media (max-width:480px){.d-meta{grid-template-columns:1fr}}

/* ============ 空状态 ============ */
.empty{text-align:center;padding:52px 20px;color:var(--ink-3)}
.empty b{display:block;font-size:16px;color:var(--ink-2);margin-bottom:6px}

/* ============ 页脚 ============ */
.footer{border-top:1px solid var(--border);background:var(--surface);margin-top:34px}
.footer-inner{max-width:1200px;margin:0 auto;padding:26px 22px;text-align:center;color:var(--ink-3);font-size:12.5px}
.footer-inner b{color:var(--ink-2);font-weight:600}
.footer .links{display:flex;justify-content:center;gap:6px 20px;margin-bottom:10px;flex-wrap:wrap}
.footer .links a{color:var(--ink-2);display:inline-block;padding:5px 3px}
.footer .links a:hover{color:var(--accent)}

/* ============ Toast ============ */
#toast{
  position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(18px);
  background:var(--ink);color:var(--surface);
  padding:11px 22px;border-radius:12px;font-size:13.5px;
  opacity:0;pointer-events:none;transition:all .24s;z-index:99;
  box-shadow:0 10px 34px rgba(0,0,0,.28);max-width:92vw;text-align:center;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ============ 响应式 ============ */
@media (max-width:1024px){
  .dl-layout{grid-template-columns:1fr}
  .sidebar{position:static;display:flex;flex-wrap:wrap;gap:4px;padding:10px}
  .side-group{display:contents}
  .side-group-title{display:none}
  .side-item{width:auto;padding:6px 12px;font-size:13px}
  .side-item .count{display:none}
  .feature-grid{grid-template-columns:1fr}
  .steps{grid-template-columns:1fr}
}
@media (max-width:760px){

  .nav.open{display:flex}
  .nav a{padding:11px 14px;font-size:14.5px}
  .menu-btn{display:inline-flex}
  .top-search{order:3;flex-basis:100%;max-width:none}
  .search-box{max-width:none}
  #view{padding:18px 14px 8px}
  .hero{padding:28px 24px}
  .hero-stats{grid-template-columns:1fr 1fr}
  .family-grid{grid-template-columns:repeat(2,1fr)}
  .cta-band .btn{margin-left:0}
}
@media (max-width:520px){
  body{font-size:15px}
  .search-box input{font-size:16px}
  .hero-stats{grid-template-columns:1fr 1fr;gap:9px}
  .iso-actions{width:100%;justify-content:flex-end}
  .iso-file{font-size:13.5px}
  .lang-grid{grid-template-columns:1fr}
  .lang-cell .lang-name{width:96px}
  .lang-search{width:100%;margin-left:0}
  .family-grid{grid-template-columns:1fr}
  .dl-tools{margin-left:0;width:100%}
}

function itemsFiltered(){
  var q=state.query.trim().toLowerCase();
  return ITEMS.filter(function(it){
    if(q){
      var hay=(it.file+" "+it.edition+" "+it.note).toLowerCase();
      if(it.langMap){hay+=" "+LANGUAGES.map(function(L){return L[0]+" "+L[1];}).join(" ");}
      if(hay.indexOf(q)<0)return false;
    }
    if(!q){
      if(state.fam){
        if(familyItems(state.fam).indexOf(it)<0)return false;
      }else if(state.cat!=="search"&&state.cat!=="all"&&it.cat!==state.cat)return false;
    }
    if(state.arch!=="all"&&it.arch!==state.arch)return false;
    if(state.edition!=="all"&&it.edition!==state.edition)return false;
    return true;
  });
}

    +guideSection
    +(rel.length?'<section class="panel"><div class="panel-head"><div><div class="panel-title">'+ICO.grid+' 同版本其他镜像</div><div class="panel-sub">同一版本的其他架构与版本类型</div></div></div>'+rel+'</section>':"")
    +(famChips?'<section class="panel"><div class="panel-head"><div><div class="panel-title">'+ICO.grid+' 同家族其他版本</div><div class="panel-sub">切换到同一系统家族的其他版本</div></div></div><div class="fam-chips">'+famChips+'</div></section>':"")
    +'<div class="cta-band"><div><h2>返回镜像列表</h2><p>继续浏览其他版本与工具资源。</p></div><a class="btn" href="#/downloads/'+esc(it.cat)+'">'+ICO.go+' 返回下载页</a></div>';
  mount(html);
  setActiveNav("downloads");
}

/* ---------- 路由 ---------- */
function route(){
  var r=parseRoute();
  if(r.view==="downloads"){
    if(r.cat){state.cat=r.cat;state.fam=null;state.query="";var si=$("#searchInput");if(si)si.value="";}
    else if(r.fam){state.fam=r.fam;state.query="";var si2=$("#searchInput");if(si2)si2.value="";}
    renderDownloads();
  }else if(r.view==="detail"){renderDetail(r.file);}
  else if(r.view==="faq"){renderFaq();}
  else if(r.view==="about"){renderAbout();}
  else{renderHome();}
}

/* ---------- 主题 ---------- */
function applyTheme(t){
  document.documentElement.setAttribute("data-theme",t);
  $("#icoSun").style.display=(t==="dark")?"none":"";
  $("#icoMoon").style.display=(t==="dark")?"":"none";
  try{localStorage.setItem("winiso-theme",t);}catch(e){}
}
function initTheme(){
  var saved=null;
  try{saved=localStorage.getItem("winiso-theme");}catch(e){}
  if(saved){applyTheme(saved);}
  else{applyTheme(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");}
}

/* ---------- 事件 ---------- */
document.addEventListener("click",function(e){
  var nav=e.target.closest("[data-nav-cat]");
  if(nav){
    state.query="";
    var si=$("#searchInput");if(si)si.value="";
    location.hash="#/downloads/"+nav.getAttribute("data-nav-cat");
    return;
  }
  var chip=e.target.closest("[data-f]");
  if(chip){
    state[chip.getAttribute("data-f")]=chip.getAttribute("data-v");
    renderDownloads();
    return;
  }
  var copy=e.target.closest("[data-copy]");
  if(copy){copyText(copy.getAttribute("data-copy"),"文件名已复制");return;}
  var lcopy=e.target.closest("[data-lcopy]");
  if(lcopy){copyText(lcopy.getAttribute("data-lcopy"),"语言文件名已复制");return;}
  var det=e.target.closest("[data-detail]");
  if(det){
    location.hash="#/detail/"+encodeURIComponent(det.getAttribute("data-detail"));
    return;
  }
  var langs=e.target.closest("[data-langs]");
  if(langs){
    var fname=langs.getAttribute("data-langs");
    var it=ITEMS.find(function(x){return x.file===fname;});
    if(it)toggleLangPanel(it,langs);
    return;
  }
  var ca=e.target.closest("[data-copy-all]");
  if(ca){
    var list=itemsFiltered();
    if(!list.length){toast("当前列表为空");return;}
    copyText(list.map(function(x){return x.file;}).join("\n"),"已复制 "+list.length+" 个文件名");
    return;
  }
  var faq=e.target.closest("[data-faq]");
  if(faq!==null){
    var item=faq.closest(".faq-item");
    var was=item.classList.contains("open");
    $$(".faq-item").forEach(function(x){x.classList.remove("open");x.querySelector(".faq-a").style.maxHeight=null;});
    if(!was){
      item.classList.add("open");
      var a=item.querySelector(".faq-a");
      a.style.maxHeight=a.scrollHeight+"px";
    }
    return;
  }
});
document.addEventListener("input",function(e){
  var lf=e.target.closest(".lang-filter");
  if(lf){
    var panel=lf.closest(".lang-panel");
    var cells=panel.querySelectorAll(".lang-cell");
    var f=lf.value.trim().toLowerCase();
    var visible=0;
    cells.forEach(function(c){
      var name=c.getAttribute("data-lname"),code=c.getAttribute("data-lcode");
      var show=!f||name.toLowerCase().indexOf(f)>=0||code.indexOf(f)>=0;
      c.style.display=show?"":"none";
      if(show)visible++;
    });
    panel.querySelector(".lang-count").textContent="显示 "+visible+" / "+LANGUAGES.length+" 种语言";
    return;
  }
});
var searchTimer=null;
$("#searchInput").addEventListener("input",function(){
  clearTimeout(searchTimer);
  var val=this.value;
  searchTimer=setTimeout(function(){
    var q=val.trim();
    if(q){
      if(preSearchHash===null){preSearchHash=location.hash||"#/";}
      state.query=q;state.cat=state.cat||"win11-26h2";
      renderDownloads();
    }else{
      state.query="";
      if(preSearchHash!==null){
        try{history.replaceState(null,"",preSearchHash);}catch(err){}
        preSearchHash=null;
      }
      route();
    }
  },200);
});
$("#themeBtn").addEventListener("click",function(){
  applyTheme(document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark");
});
$("#menuBtn").addEventListener("click",function(){
  var nav=$("#topNav");
  var open=nav.classList.toggle("open");
  this.setAttribute("aria-expanded",open?"true":"false");
});
window.addEventListener("hashchange",function(){route();});

/* ---------- 初始化 ---------- */
initTheme();
route();
})();
</script>
</body>
</html>
